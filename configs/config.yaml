# DocMind config
models:
  embedding: "sentence-transformers/all-MiniLM-L6-v2"
  reranker: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  ollama: "llama3:8b"
  groq: "openai/gpt-oss-20b"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  index_path: "data/processed/faiss.index"
  metadata_path: "data/processed/metadata.pkl"
  chunks_path: "data/processed/chunks.jsonl"

chunking:
  chunk_size: 400
  chunk_overlap: 50
  min_chunk_chars: 200

retrieval:
  faiss_k: 15
  rerank_k: 5
  similarity_threshold: 0.35

redis:
  ttl_seconds: 86400
  key_prefix: "docmind:cache:"

benchmark:
  eval_queries_path: "data/processed/eval_queries.txt"
  mlflow_experiment: "docmind-rag"
  wandb_project: "domain-rag-agent"
